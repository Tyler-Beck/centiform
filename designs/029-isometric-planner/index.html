<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isometric Planner · Centiform</title>
<style>
/* @fonts: Bungee:400:block; Sen:400,700:swap */
@font-face{font-family:"Bungee";font-style:normal;font-weight:400;font-display:block;src:url(fonts/bungee-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:"Sen";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/sen-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:"Sen";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/sen-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
/* @fonts-end */
:root {
  --bg: #cfe3a8;          /* open grass */
  --ink: #2d2a32;         /* toolbar ink */
  --accent-1: #4d8fd1;    /* commercial zone */
  --accent-2: #e6b422;    /* industrial zone */
  --res: #3f9a4a;         /* residential zone */
  --water: #7db7e8;
  --road: #6d6a72;
  --panel: #f6f4ec;
  --edge: #bfbaa9;
  --u: 8px;
  /* scale: 1.2 on 16px, rounded */
  --t-1: 13px; --t0: 16px; --t1: 19px; --t2: 23px; --t3: 28px; --t4: 34px;
  --disp: "Bungee", "Impact", sans-serif;
  --text: "Sen", "Verdana", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 var(--t0)/1.45 var(--text); display: grid; grid-template-columns: 88px minmax(0, 1fr) 380px; grid-template-rows: 64px minmax(0, 1fr) 48px; min-height: 100vh; overflow-x: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent-1); outline-offset: 2px; }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: calc(var(--u) * 4); padding: 0 calc(var(--u) * 3); background: var(--ink); color: var(--panel); }
.top h1 { margin: 0; font: 400 var(--t2)/1 var(--disp); letter-spacing: .02em; }
.stat { display: flex; flex-direction: column; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #b8b3c2; }
.stat b { font: 400 var(--t1)/1.1 var(--disp); letter-spacing: 0; color: var(--panel); font-variant-numeric: tabular-nums; }
.stat.fund b { color: var(--accent-2); }
.top .grow { flex: 1; }
.speed { display: flex; gap: 2px; }
.speed button { background: #45414c; border: 0; padding: 6px 10px; cursor: pointer; font: 400 var(--t-1)/1 var(--disp); color: var(--panel); }
.speed button[aria-pressed="true"] { background: var(--accent-2); color: var(--ink); }

.tools { background: var(--panel); border-right: 3px solid var(--ink); display: flex; flex-direction: column; gap: 6px; padding: 10px; }
.tool { width: 64px; height: 64px; border: 2px solid var(--edge); background: #fff; cursor: pointer; display: grid; place-items: center; padding: 0; position: relative; }
.tool svg { width: 40px; height: 40px; }
.tool span { position: absolute; bottom: 2px; font: 700 10px/1 var(--text); letter-spacing: .06em; text-transform: uppercase; }
.tool[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 -5px 0 var(--c, var(--ink)); background: #fffdf5; }

.board { position: relative; overflow: hidden; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 55%, #d9ebb4, var(--bg) 70%); }
.board svg { width: 100%; height: 100%; max-height: calc(100vh - 112px); }
.board .t { cursor: pointer; }
.board .t:hover .top-face { filter: brightness(1.12); }
.hint { position: absolute; left: calc(var(--u) * 2); top: calc(var(--u) * 2); background: var(--panel); border: 2px solid var(--ink); padding: 6px 10px; font-size: var(--t-1); }
.hint b { font-family: var(--disp); font-weight: 400; }
.b { transform-box: fill-box; transform-origin: 50% 100%; }

.budget { background: var(--panel); border-left: 3px solid var(--ink); padding: calc(var(--u) * 2) calc(var(--u) * 3); overflow: auto; }
.budget h2 { margin: 0 0 var(--u); font: 400 var(--t1)/1.2 var(--disp); }
.budget h3 { margin: calc(var(--u) * 2) 0 var(--u); font: 700 var(--t-1)/1 var(--text); letter-spacing: .14em; text-transform: uppercase; color: #6c6873; }
.row { display: grid; grid-template-columns: 14px 1fr 44px 74px; align-items: center; gap: 8px; padding: 4px 0; font-size: 15px; font-variant-numeric: tabular-nums; }
.row i { width: 14px; height: 14px; border: 2px solid var(--ink); background: var(--c); }
.row output { text-align: right; font-weight: 700; }
.row .amt { text-align: right; }
input[type=range] { grid-column: 2 / 4; width: 100%; accent-color: var(--ink); height: 18px; margin: 0; }
.row label { grid-column: 2; }
.row .pc { text-align: right; }
.net { margin-top: calc(var(--u) * 2); border-top: 3px solid var(--ink); padding-top: var(--u); display: flex; justify-content: space-between; align-items: baseline; }
.net b { font: 400 var(--t3)/1 var(--disp); font-variant-numeric: tabular-nums; }
.net b.neg { color: #b23b2b; }
.bars { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; align-items: end; height: 70px; margin-top: var(--u); border-bottom: 2px solid var(--ink); }
.bars span { background: var(--accent-1); }
.bars span.neg { background: #b23b2b; }
.news { grid-column: 1 / -1; background: var(--accent-2); border-top: 3px solid var(--ink); display: flex; align-items: center; gap: calc(var(--u) * 2); padding: 0 calc(var(--u) * 3); font-size: 15px; overflow: hidden; white-space: nowrap; }
.news b { font: 400 var(--t-1)/1 var(--disp); background: var(--ink); color: var(--accent-2); padding: 5px 8px; }
@media (prefers-reduced-motion: no-preference) {
  .b.new { animation: rise .5s steps(5) both; }
  @keyframes rise { from { transform: scaleY(0); } }
}
@media (max-width: 1000px) {
  body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 52vh auto auto; height: auto; }
  .top { flex-wrap: wrap; padding: var(--u) calc(var(--u) * 2); gap: var(--u) calc(var(--u) * 3); }
  .top h1 { width: 100%; }
  .top .grow { display: none; }
  .tools { flex-direction: row; border-right: 0; border-bottom: 3px solid var(--ink); overflow-x: auto; }
  .tool { width: 56px; height: 56px; flex: none; }
  .budget { border-left: 0; border-top: 3px solid var(--ink); }
  .news { white-space: normal; padding: var(--u) calc(var(--u) * 2); }
  .board svg { max-height: 52vh; }
}
</style>
</head>
<body>
<header class="top">
  <h1>Port Ellery</h1>
  <div class="stat"><span>Date</span><b id="date">Mar 1994</b></div>
  <div class="stat"><span>Population</span><b id="pop">0</b></div>
  <div class="stat fund"><span>Treasury</span><b id="fund">$0</b></div>
  <span class="grow"></span>
  <div class="speed" role="group" aria-label="Game speed"><button type="button" aria-pressed="false">II</button><button type="button" aria-pressed="true">&gt;</button><button type="button" aria-pressed="false">&gt;&gt;</button></div>
</header>

<nav class="tools" aria-label="Zoning tools">
  <button class="tool" type="button" data-z="R" style="--c: #3f9a4a" aria-pressed="true" aria-label="Zone residential"><svg viewBox="0 0 40 40"><path d="M20 6 L36 14 L20 22 L4 14 Z" fill="#3f9a4a" stroke="#2d2a32" stroke-width="2"/><path d="M12 16 v-6 l8 -4 l8 4 v6" fill="none" stroke="#2d2a32" stroke-width="2"/></svg><span>Res</span></button>
  <button class="tool" type="button" data-z="C" style="--c: #4d8fd1" aria-pressed="false" aria-label="Zone commercial"><svg viewBox="0 0 40 40"><path d="M20 6 L36 14 L20 22 L4 14 Z" fill="#4d8fd1" stroke="#2d2a32" stroke-width="2"/><rect x="15" y="2" width="10" height="14" fill="#fff" stroke="#2d2a32" stroke-width="2"/></svg><span>Com</span></button>
  <button class="tool" type="button" data-z="I" style="--c: #e6b422" aria-pressed="false" aria-label="Zone industrial"><svg viewBox="0 0 40 40"><path d="M20 6 L36 14 L20 22 L4 14 Z" fill="#e6b422" stroke="#2d2a32" stroke-width="2"/><path d="M14 16 V4 h4 v8 M22 14 V8 h4 v6" fill="none" stroke="#2d2a32" stroke-width="2"/></svg><span>Ind</span></button>
  <button class="tool" type="button" data-z="road" style="--c: #6d6a72" aria-pressed="false" aria-label="Build road"><svg viewBox="0 0 40 40"><path d="M20 6 L36 14 L20 22 L4 14 Z" fill="#6d6a72" stroke="#2d2a32" stroke-width="2"/><path d="M12 10 L28 18" stroke="#fff" stroke-width="2" stroke-dasharray="3 3"/></svg><span>Road</span></button>
  <button class="tool" type="button" data-z="park" style="--c: #9cc46a" aria-pressed="false" aria-label="Plant a park"><svg viewBox="0 0 40 40"><path d="M20 6 L36 14 L20 22 L4 14 Z" fill="#9cc46a" stroke="#2d2a32" stroke-width="2"/><circle cx="20" cy="9" r="6" fill="#3f7a3a" stroke="#2d2a32" stroke-width="2"/></svg><span>Park</span></button>
  <button class="tool" type="button" data-z="clear" style="--c: #b23b2b" aria-pressed="false" aria-label="Bulldoze"><svg viewBox="0 0 40 40"><path d="M20 6 L36 14 L20 22 L4 14 Z" fill="#cfe3a8" stroke="#2d2a32" stroke-width="2"/><path d="M13 8 L27 20 M27 8 L13 20" stroke="#b23b2b" stroke-width="3"/></svg><span>Clear</span></button>
</nav>

<main class="board">
  <div class="hint" id="hint">Tool: <b>Residential</b> · click a tile</div>
  <svg id="map" viewBox="-480 -40 960 560" role="img" aria-label="Isometric map of Port Ellery, fourteen by fourteen tiles"></svg>
</main>

<aside class="budget" aria-labelledby="bud-h">
  <h2 id="bud-h">Budget · 1994</h2>
  <h3>Property tax</h3>
  <div class="row"><i style="--c: #3f9a4a"></i><label for="tR">Residential</label><output id="oR">7%</output><span class="amt" id="aR"></span><input id="tR" type="range" min="0" max="20" value="7"></div>
  <div class="row"><i style="--c: #4d8fd1"></i><label for="tC">Commercial</label><output id="oC">8%</output><span class="amt" id="aC"></span><input id="tC" type="range" min="0" max="20" value="8"></div>
  <div class="row"><i style="--c: #e6b422"></i><label for="tI">Industrial</label><output id="oI">9%</output><span class="amt" id="aI"></span><input id="tI" type="range" min="0" max="20" value="9"></div>
  <h3>Departments, funding</h3>
  <div class="row"><i style="--c: #2d2a32"></i><label for="dP">Police</label><output id="oP">100%</output><span class="amt" id="eP"></span><input id="dP" type="range" min="0" max="100" value="100"></div>
  <div class="row"><i style="--c: #b23b2b"></i><label for="dF">Fire</label><output id="oF">100%</output><span class="amt" id="eF"></span><input id="dF" type="range" min="0" max="100" value="100"></div>
  <div class="row"><i style="--c: #9cc46a"></i><label for="dS">Schools</label><output id="oS">80%</output><span class="amt" id="eS"></span><input id="dS" type="range" min="0" max="100" value="80"></div>
  <div class="row"><i style="--c: #6d6a72"></i><label for="dT">Roads</label><output id="oT">90%</output><span class="amt" id="eT"></span><input id="dT" type="range" min="0" max="100" value="90"></div>
  <div class="net"><span>Net per month</span><b id="net">$0</b></div>
  <div class="bars" id="bars" aria-hidden="true"></div>
</aside>
<footer class="news"><b>Ellery Courier</b><span id="news">Mayor’s office opens. The council asks for a budget by the end of the month.</span></footer>
<script>
(() => {
  const N = 14, W = 32, H = 16, NS = "http://www.w3.org/2000/svg";
  const COL = { grass: ["#cfe3a8", "#b7cf8f", "#a8c27f"], water: ["#7db7e8", "#6aa4d6", "#5a93c4"], road: ["#6d6a72", "#57545c", "#4a4750"], park: ["#9cc46a", "#86ad57", "#779c4b"],
    R: ["#3f9a4a", "#338040", "#2b6e37"], C: ["#4d8fd1", "#3f79b3", "#356a9e"], I: ["#e6b422", "#c99a18", "#b08614"] };
  const BLD = { R: ["#f4efe0", "#dcd4bd", "#c9c0a6"], C: ["#dbe8f6", "#b9cde6", "#9fb8d6"], I: ["#d8d2c6", "#bdb6a7", "#a59e8f"] };
  // a hand-laid starting town: river, two roads, a few zones
  const map = [];
  for (let r = 0; r < N; r++) { map[r] = []; for (let c = 0; c < N; c++) {
    let z = "grass";
    const rv = (k) => 3 + Math.round(Math.sin(k / 2.2) * 1.2);
    if (c === rv(r) || c === rv(r - 1)) z = "water";
    if (r === 6 && z !== "water") z = "road";
    if (c === 8) z = "road";
    map[r][c] = { z, lv: 0 };
  } }
  [[4, 9, "R", 2], [4, 10, "R", 1], [5, 9, "R", 3], [5, 10, "R", 2], [5, 11, "R", 1], [7, 9, "C", 3], [7, 10, "C", 2], [5, 7, "C", 4], [7, 7, "C", 2], [9, 5, "I", 2], [10, 5, "I", 3], [9, 6, "I", 1], [3, 12, "park", 0], [8, 11, "R", 1], [9, 9, "R", 2], [2, 9, "R", 1], [2, 10, "R", 2], [3, 9, "R", 1], [4, 11, "R", 3], [7, 12, "C", 1], [10, 9, "R", 1], [10, 10, "R", 2], [11, 9, "R", 1], [11, 6, "I", 2], [12, 6, "I", 1], [4, 6, "C", 1], [5, 6, "C", 2], [3, 7, "R", 2], [2, 7, "R", 1], [11, 12, "park", 0], [1, 11, "park", 0]]
    .forEach(([r, c, z, lv]) => { map[r][c] = { z, lv }; });
  const svg = document.getElementById("map");
  const pt = (c, r, h = 0) => [(c - r) * W, (c + r) * H - h];
  const poly = (pts, fill, cls) => `<polygon ${cls ? `class="${cls}"` : ""} points="${pts.map((p) => p.join(",")).join(" ")}" fill="${fill}" stroke="#2d2a32" stroke-width="1" stroke-linejoin="round"/>`;
  let fresh = null;
  function draw() {
    let out = "";
    for (let s = 0; s < N * 2 - 1; s++) for (let r = 0; r < N; r++) { const c = s - r; if (c < 0 || c >= N) continue;
      const t = map[r][c], cl = COL[t.z];
      const a = pt(c, r), b = pt(c + 1, r), d = pt(c + 1, r + 1), e = pt(c, r + 1);
      out += `<g class="t" data-r="${r}" data-c="${c}">`;
      out += poly([a, b, d, e], cl[0], "top-face");
      if (r === N - 1) out += poly([e, d, [d[0], d[1] + 10], [e[0], e[1] + 10]], "#8a7a5a");
      if (c === N - 1) out += poly([b, d, [d[0], d[1] + 10], [b[0], b[1] + 10]], "#6f6248");
      if (t.z === "road") out += `<path d="M${(a[0] + e[0]) / 2} ${(a[1] + e[1]) / 2} L${(b[0] + d[0]) / 2} ${(b[1] + d[1]) / 2}" stroke="#e8e4d8" stroke-width="1.5" stroke-dasharray="4 4"/>`;
      if (t.z === "park") { const [x, y] = pt(c + .5, r + .5); out += `<circle cx="${x}" cy="${y - 10}" r="8" fill="#3f7a3a" stroke="#2d2a32"/><circle cx="${x + 10}" cy="${y - 4}" r="6" fill="#4d8a44" stroke="#2d2a32"/>`; }
      if (BLD[t.z] && t.lv > 0) {
        const h = t.z === "C" ? 14 + t.lv * 14 : t.z === "I" ? 12 + t.lv * 6 : 8 + t.lv * 7, k = .22, bc = BLD[t.z];
        const A = pt(c + k, r + k), B = pt(c + 1 - k, r + k), D = pt(c + 1 - k, r + 1 - k), E = pt(c + k, r + 1 - k);
        const up = (p) => [p[0], p[1] - h];
        out += `<g class="b${fresh === r * N + c ? " new" : ""}">` + poly([E, D, up(D), up(E)], bc[1]) + poly([D, B, up(B), up(D)], bc[2]) + poly([up(A), up(B), up(D), up(E)], bc[0]);
        if (t.z === "I") { const [x, y] = up(pt(c + .62, r + .38)); out += `<rect x="${x - 3}" y="${y - 14}" width="6" height="14" fill="#a59e8f" stroke="#2d2a32"/>`; }
        if (t.z === "R") { const [x1, y1] = up(E), [x2, y2] = up(A), [x3, y3] = up(B); out += `<path d="M${x1} ${y1} L${(x1 + x3) / 2} ${(y1 + y3) / 2 - 10} L${x3} ${y3} Z" fill="#b8472f" stroke="#2d2a32"/>`; }
        out += `</g>`;
      }
      out += `</g>`;
    }
    svg.innerHTML = out; fresh = null;
  }
  const $ = (id) => document.getElementById(id);
  let tool = "R", fund = 48200, month = 2, year = 1994, hist = [];
  const NAMES = { R: "Residential", C: "Commercial", I: "Industrial", road: "Road", park: "Park", clear: "Bulldozer" };
  document.querySelector(".tools").addEventListener("click", (e) => { const b = e.target.closest(".tool"); if (!b) return; tool = b.dataset.z;
    document.querySelectorAll(".tool").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); $("hint").innerHTML = "Tool: <b>" + NAMES[tool] + "</b> · click a tile"; });
  svg.addEventListener("click", (e) => { const g = e.target.closest(".t"); if (!g) return; const r = +g.dataset.r, c = +g.dataset.c, t = map[r][c];
    if (t.z === "water") { $("news").textContent = "The harbour engineer reminds the mayor that you cannot zone the river."; return; }
    const cost = { R: 100, C: 150, I: 200, road: 60, park: 90, clear: 20 }[tool];
    if (fund < cost) { $("news").textContent = "The treasury is empty. Raise taxes or wait for the month to turn."; return; }
    fund -= cost; map[r][c] = tool === "clear" ? { z: "grass", lv: 0 } : { z: tool, lv: BLD[tool] ? 1 : 0 }; fresh = r * N + c; draw(); calc();
    $("news").textContent = tool === "clear" ? `Lot ${r}-${c} cleared for $20.` : `${NAMES[tool]} zoning approved on lot ${r}-${c}. Cost $${cost}.`; });
  const v = (id) => +$(id).value;
  function calc() {
    let R = 0, C = 0, I = 0;
    map.flat().forEach((t) => { if (t.z === "R") R += t.lv; if (t.z === "C") C += t.lv; if (t.z === "I") I += t.lv; });
    const pop = R * 410 + C * 60 + I * 30;
    const iR = Math.round(pop * v("tR") * .12), iC = Math.round(C * 900 * v("tC") / 10), iI = Math.round(I * 1100 * v("tI") / 10);
    const eP = Math.round(pop * .09 * v("dP") / 100), eF = Math.round(pop * .07 * v("dF") / 100), eS = Math.round(pop * .12 * v("dS") / 100), eT = Math.round(map.flat().filter((t) => t.z === "road").length * 22 * v("dT") / 100);
    const net = iR + iC + iI - eP - eF - eS - eT;
    const f = (n) => "$" + n.toLocaleString("en-US");
    [["oR", v("tR") + "%"], ["oC", v("tC") + "%"], ["oI", v("tI") + "%"], ["oP", v("dP") + "%"], ["oF", v("dF") + "%"], ["oS", v("dS") + "%"], ["oT", v("dT") + "%"],
      ["aR", f(iR)], ["aC", f(iC)], ["aI", f(iI)], ["eP", "−" + f(eP)], ["eF", "−" + f(eF)], ["eS", "−" + f(eS)], ["eT", "−" + f(eT)]].forEach(([id, t]) => ($(id).textContent = t));
    $("net").textContent = (net < 0 ? "−" : "+") + f(Math.abs(net)); $("net").classList.toggle("neg", net < 0);
    $("pop").textContent = pop.toLocaleString("en-US"); $("fund").textContent = f(fund);
    return net;
  }
  document.querySelectorAll("input[type=range]").forEach((i) => i.addEventListener("input", calc));
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  let speed = 1;
  document.querySelector(".speed").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; speed = [...b.parentNode.children].indexOf(b);
    b.parentNode.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); });
  function month_() {
    const net = calc(); fund += net; hist.push(net); if (hist.length > 12) hist.shift();
    // growth: zoned lots rise when taxes are fair
    const cands = []; map.forEach((row, r) => row.forEach((t, c) => { if (BLD[t.z] && t.lv < 4) cands.push([r, c]); }));
    const fair = v("tR") + v("tC") + v("tI") < 30;
    if (fair && cands.length) { const [r, c] = cands[(month * 7 + year) % cands.length]; map[r][c].lv++; fresh = r * N + c; draw(); }
    month++; if (month > 11) { month = 0; year++; }
    $("date").textContent = MON[month] + " " + year; calc();
    const max = Math.max(1, ...hist.map(Math.abs));
    $("bars").innerHTML = hist.map((n) => `<span class="${n < 0 ? "neg" : ""}" style="height:${Math.max(4, Math.abs(n) / max * 100)}%"></span>`).join("");

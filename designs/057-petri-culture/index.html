<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petri Culture · Centiform</title>
<style>
/* @fonts: Lexend:300,500:swap; Victor Mono:400,400i:swap */
@font-face{font-family:"Lexend";font-style:normal;font-weight:300;font-display:swap;src:url(fonts/lexend-latin-300-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:"Lexend";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/lexend-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:"Victor Mono";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/victor-mono-greek-400-normal.woff2) format("woff2");unicode-range:U+0370-0377,U+037A-037F,U+0384-038A,U+038C,U+038E-03A1,U+03A3-03FF;}
@font-face{font-family:"Victor Mono";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/victor-mono-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:"Victor Mono";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/victor-mono-greek-400-italic.woff2) format("woff2");unicode-range:U+0370-0377,U+037A-037F,U+0384-038A,U+038C,U+038E-03A1,U+03A3-03FF;}
@font-face{font-family:"Victor Mono";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/victor-mono-latin-400-italic.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
/* @fonts-end */
:root {
  --bg: #f8f2e2;          /* bench paper */
  --ink: #2a2a2a;         /* marker black */
  --accent-1: #e0a33b;    /* nutrient agar amber */
  --accent-2: #b93a6b;    /* blood agar and MacConkey pink */
  --glass: rgba(255,255,255,.55);
  --rule: #e2d6b8;
  --u: 8px;
  /* scale: 1.25 on 16px */
  --t-1: 12.8px; --t0: 16px; --t1: 20px; --t2: 25px; --t3: 31px; --t4: clamp(34px, 3.8vw, 56px);
  --sans: "Lexend", "Verdana", sans-serif;
  --mono: "Victor Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; color: var(--ink); background: var(--bg); font: 300 var(--t0)/1.6 var(--sans); overflow-x: hidden; }
a { color: inherit; }
:focus-visible { outline: 3px dashed var(--accent-2); outline-offset: 4px; }
header { display: flex; justify-content: space-between; align-items: end; flex-wrap: wrap; gap: calc(var(--u) * 2); padding: calc(var(--u) * 3) calc(var(--u) * 4) calc(var(--u) * 2); }
header h1 { margin: 0; font: 500 var(--t4)/1 var(--sans); letter-spacing: -.02em; }
header p { margin: 4px 0 0; font: italic 400 var(--t0)/1.3 var(--mono); }
.stats { display: flex; gap: calc(var(--u) * 2); }
.stat { width: 104px; height: 104px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-content: center; text-align: center; background: radial-gradient(circle, #fff9ea 60%, #efe4c6); }
.stat b { font: 500 var(--t2)/1 var(--sans); font-variant-numeric: tabular-nums; }
.stat span { font: 400 10.5px/1.2 var(--mono); letter-spacing: .04em; }
.bench { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); gap: calc(var(--u) * 4); padding: calc(var(--u) * 2) calc(var(--u) * 4) calc(var(--u) * 5); }
.plates { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: calc(var(--u) * 3) calc(var(--u) * 3); align-items: center; }
.plate { all: unset; position: relative; aspect-ratio: 1; border-radius: 50%; cursor: pointer; display: block; }
.plate svg { width: 100%; height: 100%; display: block; overflow: visible; }
.plate.sm { width: 74%; justify-self: center; }
.plate:focus-visible { outline: 3px dashed var(--accent-2); outline-offset: 6px; }
.plate .col { transform-box: fill-box; transform-origin: center; }
.plate[aria-pressed="true"] .rim { stroke: var(--accent-2); stroke-width: 4; }
.lid { font: italic 400 11px var(--mono); fill: var(--ink); }
.note { background: repeating-linear-gradient(transparent 0 27px, var(--rule) 27px 28px), #fffaf0; border-left: 3px double var(--accent-2); padding: 6px calc(var(--u) * 3) calc(var(--u) * 3); font: 400 15px/28px var(--mono); }
.note h2 { margin: 0; font: 500 var(--t1)/28px var(--sans); }
.note .id { font-style: italic; color: var(--accent-2); }
.note dl { display: grid; grid-template-columns: auto 1fr; column-gap: calc(var(--u) * 2); margin: 0; }
.note dt { color: #6b6353; }
.note dd { margin: 0; }
.note p { margin: 0; }
.big { width: min(100%, 300px); aspect-ratio: 1; margin: calc(var(--u) * 2) auto; }
.big svg { width: 100%; height: 100%; }
footer { padding: 0 calc(var(--u) * 4) calc(var(--u) * 4); font: italic 400 var(--t-1)/1.5 var(--mono); }
@media (prefers-reduced-motion: no-preference) {
  .plate .col { transform: scale(.55); transition: transform 1.6s cubic-bezier(.2,.8,.2,1); transition-delay: var(--dl, 0s); }
  .plate:hover .col, .plate:focus-visible .col, .plate[aria-pressed="true"] .col { transform: scale(1); }
}
@media (max-width: 1000px) {
  .bench { grid-template-columns: minmax(0, 1fr); }
  .plates { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats { gap: 6px; }
  .stat { width: 84px; height: 84px; }
  header, .bench { padding-left: calc(var(--u) * 2); padding-right: calc(var(--u) * 2); }
}
</style>
</head>
<body>
<header>
  <div><h1>Plate Log · Bench 4</h1><p>Harland Microbiology Lab · incubator B, 37 °C · Thu 12 Nov</p></div>
  <div class="stats" aria-label="Today">
    <div class="stat"><b>12</b><span>plates in</span></div>
    <div class="stat"><b>18h</b><span>since streak</span></div>
    <div class="stat"><b>3</b><span>to re-streak</span></div>
    <div class="stat" style="border-color:var(--accent-2)"><b style="color:var(--accent-2)">1</b><span>contaminated</span></div>
  </div>
</header>
<main class="bench">
  <section class="plates" id="plates" aria-label="Plates on the bench"></section>
  <aside class="note" aria-live="polite" id="note"></aside>
</main>
<footer>Plates older than 72 h go to the autoclave bin, lids taped. Label on the base, not the lid: lids wander.</footer>
<script>
(() => {
  const AG = { NA: ["#f0d58c", "#e0a33b"], BA: ["#b93a6b", "#8e2450"], MAC: ["#e7a3c2", "#c9709a"], SAB: ["#efe3b0", "#d5c07a"] };
  const P = [
    { id: "4-01", org: "E. coli K-12", ag: "MAC", k: "streak", c: "#d94c8a", cfu: "streak, isolated by quadrant 3", t: "Pink colonies: lactose fermenter, as it should be. Pick a quadrant 3 colony for the overnight broth.", sm: false },
    { id: "4-02", org: "S. aureus ATCC 25923", ag: "BA", k: "streak", c: "#f6e6b4", cfu: "β-haemolysis visible", t: "Clear zones around the colonies. Golden pigment coming through after 18 h. Good.", sm: false },
    { id: "4-03", org: "Soil sample, plot C", ag: "NA", k: "mixed", c: "#fffaf0", cfu: "about 214 CFU", t: "At least six colony types. The wrinkled white one spreads: Bacillus, probably. Sub-culture it before it covers the plate.", sm: false },
    { id: "4-04", org: "Dilution 10⁻⁵", ag: "NA", k: "count", c: "#fbf3de", cfu: "63 CFU → 6.3 × 10⁷ /ml", t: "Countable. 30 to 300 is the rule; 63 sits well inside it.", sm: true },
    { id: "4-05", org: "Dilution 10⁻⁴", ag: "NA", k: "lawn", c: "#fbf3de", cfu: "too many to count", t: "A lawn. Record as TNTC and do not waste an afternoon on it.", sm: true },
    { id: "4-06", org: "Candida, swab 7", ag: "SAB", k: "count", c: "#fffdf6", cfu: "22 CFU", t: "Creamy, domed, smells of bread. Yeast on Sabouraud, as expected. 30 °C next time.", sm: false },
    { id: "4-07", org: "Air plate, bench top", ag: "NA", k: "mixed", c: "#e8c46a", cfu: "11 CFU + 1 mould", t: "Open for 15 minutes. One mould colony, green, near the edge. Wipe the bench with ethanol twice.", sm: false, bad: true },
    { id: "4-08", org: "Pseudomonas PA01", ag: "NA", k: "streak", c: "#9fc4a3", cfu: "green pigment", t: "Blue-green pigment diffused into the agar. Grape smell. Seal with film.", sm: true }
  ];
  let seed = 57; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const dish = (p, n) => {
    const [f, e] = AG[p.ag]; let c = "";
    const col = (x, y, r, fill) => (c += `<circle class="col" style="--dl:${(rnd() * .5).toFixed(2)}s" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${fill}" stroke="rgba(0,0,0,.18)" stroke-width=".6"/>`);
    if (p.k === "streak") {
      [[-1, -1, 42], [1, -1, 22], [1, 1, 9], [-1, 1, 4]].forEach(([sx, sy, nn], q) => { for (let i = 0; i < nn; i++) { const t = i / nn, zig = Math.sin(t * 18) * 14; col(sx * (18 + t * 40) + zig * sy * .5, sy * (22 + zig + t * 20), q < 1 ? 2 : 2.4 + q * .6, p.c); } });
    } else if (p.k === "count") { for (let i = 0; i < (p.cfu.startsWith("63") ? 63 : 22); i++) { const a = rnd() * 6.28, r = Math.sqrt(rnd()) * 68; col(Math.cos(a) * r, Math.sin(a) * r, 2 + rnd() * 3, p.c); } }
    else if (p.k === "lawn") { for (let i = 0; i < 520; i++) { const a = rnd() * 6.28, r = Math.sqrt(rnd()) * 72; col(Math.cos(a) * r, Math.sin(a) * r, 1.4 + rnd() * 1.4, p.c); } }
    else { const types = ["#fffaf0", "#e8c46a", "#f2e3c9", "#d8d0f0", "#fbe1b0"]; for (let i = 0; i < 70; i++) { const a = rnd() * 6.28, r = Math.sqrt(rnd()) * 68; col(Math.cos(a) * r, Math.sin(a) * r, 1.6 + rnd() * 5, types[i % types.length]); }
      if (p.bad) c += `<g class="col"><circle cx="52" cy="-30" r="14" fill="#6f8f5a" opacity=".9"/><circle cx="52" cy="-30" r="20" fill="none" stroke="#dfe8c8" stroke-width="4" opacity=".7"/></g>`; else c += `<path class="col" d="M-30 20 q10 -14 22 -2 q8 12 -6 18 q-14 4 -16 -16z" fill="#fffaf0" stroke="rgba(0,0,0,.2)"/>`; }
    return `<svg viewBox="-100 -100 200 200" aria-hidden="true"><defs><radialGradient id="ag${n}"><stop offset="0" stop-color="${f}"/><stop offset=".9" stop-color="${f}"/><stop offset="1" stop-color="${e}"/></radialGradient><path id="lr${n}" d="M-86 0 A86 86 0 0 1 86 0"/></defs>
      <circle r="96" fill="rgba(255,255,255,.4)" stroke="#bdb39c" stroke-width="1.5"/><circle class="rim" r="90" fill="url(#ag${n})" stroke="#9c9280" stroke-width="2"/>${c}
      <circle r="90" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="3" stroke-dasharray="40 300" transform="rotate(-130)"/><text class="lid"><textPath href="#lr${n}" startOffset="50%" text-anchor="middle">${p.id} · ${p.org} · ${p.ag}</textPath></text></svg>`;
  };
  const box = document.getElementById("plates");
  box.innerHTML = P.map((p, i) => `<button type="button" class="plate${p.sm ? " sm" : ""}" data-i="${i}" aria-pressed="false" aria-label="Plate ${p.id}, ${p.org}">${dish(p, i)}</button>`).join("");
  const note = document.getElementById("note");
  const show = (i) => { const p = P[i]; seed = 900 + i;
    note.innerHTML = `<h2>Plate <span class="id">${p.id}</span></h2><dl><dt>Organism</dt><dd>${p.org}</dd><dt>Agar</dt><dd>${{ NA: "Nutrient agar", BA: "Blood agar", MAC: "MacConkey", SAB: "Sabouraud" }[p.ag]}</dd><dt>Count</dt><dd>${p.cfu}</dd><dt>Incubated</dt><dd>18 h at 37 °C</dd></dl><div class="big">${dish(p, 100 + i)}</div><p>${p.t}</p><p style="color:#6b6353">Signed R. Okafor, 09:40</p>`;
    box.querySelectorAll(".plate").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.i === i))); };
  box.addEventListener("click", (e) => { const b = e.target.closest(".plate"); if (b) show(+b.dataset.i); });
  show(0);
})();
</script>
</body>
</html>

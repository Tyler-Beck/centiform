<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Catalog · Centiform</title>
<style>
/* @fonts: Anonymous Pro:400,700:swap; Libre Baskerville:400,400i,700:swap */
@font-face{font-family:"Anonymous Pro";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/anonymous-pro-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:"Anonymous Pro";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/anonymous-pro-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:"Libre Baskerville";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/libre-baskerville-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:"Libre Baskerville";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/libre-baskerville-latin-400-italic.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:"Libre Baskerville";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/libre-baskerville-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
/* @fonts-end */
:root {
  --bg: #c89b6d;          /* quarter-sawn oak */
  --ink: #2e1f14;
  --accent-1: #fbf8ef;    /* card stock */
  --accent-2: #b33a3a;    /* the red top rule */
  --oak-dk: #8e6440;
  --oak-lt: #d9b287;
  --brass: #c7a24c;
  --brass-dk: #7d6124;
  --u: 8px;
  /* scale 1.25 on 16px */
  --t-1: 12.8px; --t0: 16px; --t1: 20px; --t2: 25px; --t3: 31px; --t4: clamp(32px, 3.4vw, 50px);
  --type: "Anonymous Pro", "Courier New", monospace;
  --serif: "Libre Baskerville", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; color: var(--ink); background: #e9e1cf; }
body { font: 400 var(--t0)/1.5 var(--serif); min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
header { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: calc(var(--u) * 4); align-items: end; padding: calc(var(--u) * 3) calc(var(--u) * 5); border-bottom: 1px solid #cdbf9f; }
header h1 { margin: 0; font: 700 var(--t4)/1.05 var(--serif); }
header h1 small { display: block; font: italic 400 var(--t0)/1.4 var(--serif); margin-top: 6px; }
.search { position: relative; background: var(--accent-1); border-top: 3px solid var(--accent-2); padding: calc(var(--u) * 1.5) calc(var(--u) * 2); box-shadow: 0 1px 0 #d8cfb8, 0 4px 10px -6px rgba(46,31,20,.4); background-image: repeating-linear-gradient(transparent 0 23px, rgba(80,120,170,.25) 23px 24px); background-position: 0 10px; }
.search label { display: block; font: 700 var(--t-1)/1 var(--type); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }
.search input { width: 100%; border: 0; background: transparent; font: 400 var(--t1)/1.2 var(--type); color: var(--ink); outline: none; padding: 2px 0; }
.search input::placeholder { color: #8c7b66; }
.search:focus-within { box-shadow: 0 0 0 2px var(--ink), 0 4px 10px -6px rgba(46,31,20,.4); }
.search .hint { position: absolute; right: 12px; top: 10px; font: 400 12px/1 var(--type); color: #8c7b66; }
main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: calc(var(--u) * 4); padding: calc(var(--u) * 4) calc(var(--u) * 5); align-items: start; }
/* cabinet */
.cabinet { padding: calc(var(--u) * 2); border-radius: 4px; background:
  repeating-linear-gradient(92deg, rgba(90,55,25,.0) 0 7px, rgba(90,55,25,.12) 7px 8px, rgba(90,55,25,0) 8px 19px), linear-gradient(var(--oak-lt), var(--bg) 40%, var(--oak-dk));
  box-shadow: inset 0 0 0 3px #7a5433, 0 18px 24px -14px rgba(46,31,20,.7); }
.cabinet .cap { font: 700 var(--t-1)/1 var(--type); letter-spacing: .2em; text-align: center; color: #3b2718; padding: 4px 0 12px; text-transform: uppercase; }
.drawers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.drawer { min-height: 150px; }
@media (max-width: 980px) { .drawer { min-height: 0; } }
.drawer { position: relative; aspect-ratio: 5 / 3.3; border: 0; cursor: pointer; border-radius: 2px; padding: 0; color: var(--ink);
  background: repeating-linear-gradient(88deg, rgba(90,55,25,0) 0 5px, rgba(90,55,25,.14) 5px 6px, rgba(90,55,25,0) 6px 13px), linear-gradient(#d4a979, #b88a5b);
  box-shadow: inset 0 0 0 1px #6e4a2c, inset 0 2px 0 rgba(255,235,200,.4), 0 3px 0 #6e4a2c; }
.drawer .holder { position: absolute; left: 50%; top: 16%; transform: translateX(-50%); width: 64%; height: 30%; background: linear-gradient(#e2c371, var(--brass) 50%, var(--brass-dk)); border-radius: 2px; padding: 3px; box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.drawer .holder span { display: grid; place-items: center; height: 100%; background: var(--accent-1); font: 700 clamp(10px, 1vw, 14px)/1 var(--type); letter-spacing: .04em; }
.drawer .pull { position: absolute; left: 50%; bottom: 14%; width: 44%; height: 22%; transform: translateX(-50%); border-radius: 0 0 40px 40px; background: linear-gradient(#e2c371, var(--brass) 40%, var(--brass-dk)); box-shadow: 0 2px 2px rgba(0,0,0,.4); }
.drawer .pull::after { content: ""; position: absolute; left: 12%; right: 12%; top: 0; height: 50%; border-radius: 0 0 30px 30px; background: rgba(60,40,10,.55); }
.drawer[aria-pressed="true"] { transform: translateY(-3px); box-shadow: inset 0 0 0 2px var(--ink), 0 6px 0 #6e4a2c; }
.drawer.hit::before { content: ""; position: absolute; top: 6px; right: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent-2); box-shadow: 0 0 0 2px var(--accent-1); }
.drawer:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.cabinet .base { height: 18px; margin: 14px -16px -16px; background: linear-gradient(#7a5433, #4e331f); }
/* open drawer: the card stack */
.tray { position: sticky; top: calc(var(--u) * 2); }
.tray .front { display: flex; align-items: center; justify-content: space-between; background: linear-gradient(#cfa272, #aa7d50); padding: 12px 18px; border-radius: 3px 3px 0 0; box-shadow: inset 0 0 0 1px #6e4a2c; font: 700 var(--t-1)/1 var(--type); letter-spacing: .12em; text-transform: uppercase; }
.tray .front b { background: var(--accent-1); padding: 4px 10px; box-shadow: 0 0 0 3px var(--brass); letter-spacing: .04em; }
.stack { position: relative; background: #7a5433; padding: 14px 14px 18px; border-radius: 0 0 3px 3px; box-shadow: inset 0 8px 14px rgba(0,0,0,.35); }
.tabs { display: flex; flex-direction: column; }
.tabs button { all: unset; cursor: pointer; display: grid; grid-template-columns: 8ch minmax(0, 1fr); gap: 12px; background: var(--accent-1); border-top: 2px solid var(--accent-2); padding: 7px 14px 6px; margin-bottom: 2px; font: 400 14px/1.2 var(--type); box-shadow: 0 -1px 0 rgba(0,0,0,.1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs button span { overflow: hidden; text-overflow: ellipsis; }
.tabs button[aria-current="true"] { background: #fffef7; font-weight: 700; }
.tabs button:focus-visible { outline: 2px solid var(--accent-2); outline-offset: -2px; }
.card { position: relative; aspect-ratio: 5 / 3; background: #fffef7; border-top: 3px solid var(--accent-2); margin-top: 10px; padding: 18px 26px 26px 26px; box-shadow: 0 10px 20px -8px rgba(0,0,0,.6); font: 400 15.5px/1.45 var(--type); overflow: hidden;
  background-image: repeating-linear-gradient(transparent 0 21px, rgba(80,120,170,.22) 21px 22px); background-position: 0 38px; }
.card::after { content: ""; position: absolute; bottom: 10px; left: 50%; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: #7a5433; box-shadow: inset 0 2px 3px rgba(0,0,0,.6); }
.card .call { position: absolute; left: 26px; top: 18px; width: 9ch; }
.card .body { margin-left: 11ch; }
.card p { margin: 0; }
.card .ind { text-indent: 2ch; }
.card .tr { margin-top: 10px; font-size: 14px; }
.card .stamp { position: absolute; right: 18px; bottom: 16px; font: 700 12px/1 var(--type); color: var(--accent-2); border: 2px solid var(--accent-2); padding: 3px 6px; transform: rotate(-5deg); opacity: .8; }
.empty { color: var(--accent-1); font: 400 var(--t0)/1.5 var(--serif); padding: 20px; }
@media (max-width: 980px) {
  header, main { grid-template-columns: minmax(0, 1fr); padding: calc(var(--u) * 2); gap: calc(var(--u) * 2); }
  .drawers { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .drawer .holder span { font-size: 9px; }
  .tray { position: static; }
  .card { aspect-ratio: auto; font-size: 13px; padding: 14px 16px 34px; }
  .card .call { position: static; margin-bottom: 6px; }
  .card .body { margin-left: 0; }
}
</style>
</head>
<body>
<header>
  <h1>Pellston Free Library<small>Public catalogue, author and title cards · 14,212 volumes</small></h1>
  <div class="search">
    <label for="q">Look up an author, title or subject</label>
    <input id="q" type="search" placeholder="e.g. beekeeping" autocomplete="off">
    <span class="hint">type · 3 × 5</span>
  </div>
</header>
<main>
  <section class="cabinet" aria-label="Catalogue cabinet">
    <p class="cap">Author &amp; Title · Drawers 1–16</p>
    <div class="drawers" id="drawers"></div>
    <div class="base"></div>
  </section>
  <section class="tray" aria-live="polite">
    <div class="front"><span id="dn">Drawer</span><b id="dl"></b></div>
    <div class="stack"><div class="tabs" id="tabs"></div><article class="card" id="card"></article></div>
  </section>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  // sort key (author surname), call no., author heading, title & imprint, collation, subjects
  const B = [
    ["Adair", "638.1\nADA", "Adair, Ruth Elspeth, 1911–", "The honeybee year / by Ruth E. Adair ; drawings by the author. – New York : Harrow House, 1954.", "212 p. : ill. ; 21 cm.", ["Bee culture.", "Apiculture – Michigan."]],
    ["Aldous", "917.74\nALD", "Aldous, Grant.", "Along the Straits : a traveler’s notes / Grant Aldous. – Detroit : Lakeshore Press, 1961.", "188 p. : maps ; 20 cm.", ["Mackinac, Straits of.", "Michigan – Description and travel."]],
    ["Bellamy", "FIC\nBEL", "Bellamy, Irene.", "The cherry orchard road : a novel / Irene Bellamy. – Boston : Coyle, 1958.", "301 p. ; 22 cm.", ["Farm life – Fiction."]],
    ["Brandt", "641.5\nBRA", "Brandt, Hilde, 1902–1979.", "Cooking from the root cellar / Hilde Brandt. – Chicago : Prairie Kitchen, 1949.", "256 p. ; 23 cm.", ["Cookery, American.", "Vegetables – Storage."]],
    ["Carrow", "598.2\nCAR", "Carrow, E. V. (Edward Vance)", "Birds of the northern woods / by E. V. Carrow. – 2nd ed. – Lansing : State Nature Society, 1952.", "xii, 340 p. : col. plates ; 19 cm.", ["Birds – Michigan.", "Birds – Identification."]],
    ["Chen", "621.38\nCHE", "Chen, Walter Y.", "The home radio repairman / Walter Y. Chen. – New York : Technical Books, 1947.", "198 p. : diagrs. ; 21 cm.", ["Radio – Repairing."]],
    ["Delacroix", "FIC\nDEL", "Delacroix, Mireille.", "Winter at the lighthouse / Mireille Delacroix ; translated by Anne Pell. – New York : Harrow House, 1963.", "224 p. ; 21 cm.", ["Lighthouses – Fiction."]],
    ["Dunmore", "364.1\nDUN", "Dunmore, Arthur P.", "Crimes of the lumber camps / Arthur P. Dunmore. – Grand Rapids : Kettle, 1955.", "280 p. : ill. ; 22 cm.", ["Crime – Michigan – History.", "Lumber camps."]],
    ["Farrant", "792\nFAR", "Farrant, Dolly.", "Curtain up in Cheboygan : a history of the Opera House / Dolly Farrant. – Cheboygan : Opera House Guild, 1960.", "96 p. : ill. ; 24 cm.", ["Theaters – Michigan."]],
    ["Gray", "J\nGRA", "Gray, Tillie.", "Tobias and the snowplough / Tillie Gray ; pictures by Sam Oake. – New York : Little Lamp, 1951.", "[32] p. : col. ill. ; 26 cm.", ["Railroads – Juvenile fiction."]],
    ["Hollis", "625.1\nHOL", "Hollis, James T.", "The Pere Marquette in pictures / James T. Hollis. – Traverse City : Northland, 1966.", "144 p. : chiefly ill. ; 28 cm.", ["Railroads – Michigan – Pictorial works."]],
    ["Ingram", "977.4\nING", "Ingram, J. D.", "Pellston and Emmet County : the first hundred years / J. D. Ingram. – Pellston : Village Council, 1982.", "310 p. : ill., maps ; 25 cm.", ["Pellston (Mich.) – History."]],
    ["Kettering", "796.5\nKET", "Kettering, Hiram.", "Camping the Upper Peninsula / Hiram Kettering. – Chicago : Outdoor Library, 1957.", "166 p. : ill. ; 19 cm.", ["Camping – Michigan."]],
    ["Ledgard", "581.9\nLED", "Ledgard, A. M. (Agnes Mary), 1889–1971.", "Wildflowers of the dune country / A. M. Ledgard. – Ann Arbor : University Press, 1948.", "xvi, 288 p. : ill. ; 20 cm.", ["Wild flowers – Michigan.", "Sand dune plants."]],
    ["Marsh", "FIC\nMAR", "Marsh, Cecily.", "Death at low tide / Cecily Marsh. – New York : Crime Club, 1948.", "224 p. ; 20 cm.", ["Detective and mystery stories."]],
    ["Novak", "799.1\nNOV", "Novak, Stanley J.", "Trout of the Maple River / Stanley J. Novak. – Petoskey : Fly Line Press, 1964.", "120 p. : ill. ; 21 cm.", ["Trout fishing – Michigan."]],
    ["Oyelaran", "641.59\nOYE", "Oyelaran, Beatrice.", "My grandmother’s kitchen / Beatrice Oyelaran. – London : Plover, 1962.", "216 p. ; 18 cm.", ["Cookery, Nigerian.", "Oyelaran family."]],
    ["Pask", "824\nPAS", "Pask, Julian.", "On not owning a car : essays / Julian Pask. – London : Plover, 1952.", "176 p. ; 18 cm.", ["English essays."]],
    ["Quill", "808.1\nQUI", "Quill, Martha.", "Poems for the kitchen table / Martha Quill. – Boston : Coyle, 1959.", "80 p. ; 20 cm.", ["American poetry."]],
    ["Rennie", "910.4\nREN", "Rennie, Hilda.", "Islands of the North Sea / Hilda Rennie. – London : Plover, 1956.", "264 p. : maps ; 18 cm.", ["Islands – North Sea."]],
    ["Stone", "630\nSTO", "Stone, Clement R.", "The forty-acre farm / Clement R. Stone. – Lansing : Extension Service, 1950.", "92 p. : ill. ; 23 cm.", ["Farm management.", "Agriculture – Michigan."]],
    ["Tuttle", "529\nTUT", "Tuttle, Josiah.", "The Hollow Creek almanack for 1927 / Josiah Tuttle. – Hollow Creek : Tuttle & Sons, 1926.", "48 p. ; 19 cm.", ["Almanacs, American."]],
    ["Vance", "746.4\nVAN", "Vance, Ida May.", "Quilts of the lake shore / Ida May Vance. – Harbor Springs : Needle Guild, 1968.", "112 p. : ill. ; 27 cm.", ["Quilts – Michigan.", "Quilting – Patterns."]],
    ["Whitcombe", "FIC\nWHI", "Whitcombe, Laurence.", "The ice road / Laurence Whitcombe. – New York : Harrow House, 1965.", "288 p. ; 21 cm.", ["Frontier and pioneer life – Fiction."]],
    ["Young", "973.7\nYOU", "Young, Harriet B.", "Letters from the Michigan Fourth / edited by Harriet B. Young. – Detroit : Wayne State, 1961.", "340 p. ; 24 cm.", ["United States – History – Civil War."]]
  ];
  const D = [["A", "Al"], ["Ba", "Bz"], ["C", "Ch"], ["Ci", "Dz"], ["E", "Fz"], ["G", "Gz"], ["H", "Hz"], ["I", "Kz"], ["L", "Lz"], ["M", "Mz"], ["N", "Oz"], ["P", "Qz"], ["R", "Rz"], ["S", "Sz"], ["T", "Vz"], ["W", "Z"]];
  const inDrawer = (k, [a, b]) => k.localeCompare(a) >= 0 && k.slice(0, b.length).localeCompare(b) <= 0;
  $("drawers").innerHTML = D.map(([a, b], i) => `<button type="button" class="drawer" data-i="${i}" aria-pressed="false" aria-label="Drawer ${i + 1}, ${a} to ${b}"><span class="holder"><span>${a === b.replace("z", "") ? a : a + "–" + b.replace("z", "")}</span></span><span class="pull"></span></button>`).join("");
  let drawer = 0, pick = 0;
  function open(i, cardIdx) {
    drawer = i;
    const cards = B.map((b, k) => [b, k]).filter(([b]) => inDrawer(b[0], D[i]));
    $("drawers").querySelectorAll(".drawer").forEach((d) => d.setAttribute("aria-pressed", String(+d.dataset.i === i)));
    $("dn").textContent = `Drawer ${i + 1} · ${cards.length} cards shown`; $("dl").textContent = `${D[i][0]}–${D[i][1].replace("z", "")}`;
    if (!cards.length) { $("tabs").innerHTML = ""; $("card").innerHTML = `<p>No cards filed here yet. Ask at the desk.</p>`; return; }
    pick = cardIdx ?? cards[0][1];
    $("tabs").innerHTML = cards.map(([b, k]) => `<button type="button" data-k="${k}" aria-current="${k === pick}"><span>${b[1].split("\n").join(" ")}</span><span>${b[2].split(",")[0]}, ${b[3].split(" / ")[0]}</span></button>`).join("");
    show(pick);
  }
  function show(k) {
    pick = k;
    const [, call, head, title, coll, subj] = B[k];
    $("card").innerHTML = `<div class="call">${call.replace("\n", "<br>")}</div><div class="body"><p>${head}</p><p class="ind">${title}</p><p class="ind">${coll}</p><p class="tr">${subj.map((s, j) => `${j + 1}. ${s}`).join("  ")}  I. Title.</p></div><span class="stamp">PELLSTON F.L.</span>`;
    $("tabs").querySelectorAll("button").forEach((b) => b.setAttribute("aria-current", String(+b.dataset.k === k)));
  }
  $("drawers").addEventListener("click", (e) => { const d = e.target.closest(".drawer"); if (d) open(+d.dataset.i); });
  $("tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) show(+b.dataset.k); });
  $("q").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    const hits = q.length < 2 ? [] : B.map((b, k) => [b, k]).filter(([b]) => b.slice(2).flat().join(" ").toLowerCase().includes(q));
    $("drawers").querySelectorAll(".drawer").forEach((d, i) => d.classList.toggle("hit", hits.some(([b]) => inDrawer(b[0], D[i]))));
    if (hits.length) { const i = D.findIndex((r) => inDrawer(hits[0][0][0], r)); open(i, hits[0][1]); }
  });
  open(0);
})();
</script>
</body>
</html>

/* @fonts-end */
:root {
  --bg: #f4f6f7;          /* plate paper, cold */
  --ink: #1d2433;         /* engraving black-blue */
  --accent-1: #7a4fd1;    /* fluorite violet: faces and indices */
  --accent-2: #27a38b;    /* the axes */
  --rule: #c9d0d8;
  --u: 8px;
  --S: min(110px, 11vw);  /* one lattice unit on screen */
  /* scale: 1.25 on 17px */
  --t-1: 13.6px; --t0: 17px; --t1: 21px; --t2: 26.5px; --t3: 33px; --t4: clamp(38px, 4.4vw, 64px);
  --mono: "Spline Sans Mono", ui-monospace, monospace;
  --serif: "Literata", Georgia, serif;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; color: var(--ink); background: var(--bg); font: 400 var(--t0)/1.6 var(--serif); overflow-x: hidden; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent-1); outline-offset: 3px; }
header { display: flex; justify-content: space-between; align-items: end; gap: calc(var(--u) * 3); padding: calc(var(--u) * 4) calc(var(--u) * 5) calc(var(--u) * 2); border-bottom: 1px solid var(--ink); flex-wrap: wrap; }
header h1 { margin: 0; font: 600 var(--t4)/1 var(--serif); letter-spacing: -.01em; }
header h1 small { display: block; font: 400 var(--t-1)/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: #5b6475; margin-bottom: var(--u); }
nav.pick { display: flex; gap: 4px; flex-wrap: wrap; }
nav.pick button { font: 400 var(--t-1)/1 var(--mono); background: transparent; border: 1px solid var(--ink); color: var(--ink); padding: 8px 12px; cursor: pointer; }
nav.pick button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.spec { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); min-height: calc(100vh - 150px); }
/* the plate: a crystal on its axis cross, turning */
.plate { position: relative; border-right: 1px solid var(--ink); display: grid; place-items: center; overflow: hidden; background: linear-gradient(var(--rule) 1px, transparent 1px) 0 0 / 40px 40px, linear-gradient(90deg, var(--rule) 1px, transparent 1px) 0 0 / 40px 40px; background-color: var(--bg); }
.plate::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, transparent 30%, var(--bg) 75%); pointer-events: none; }
.stage { width: 1px; height: 1px; perspective: 1200px; position: relative; z-index: 1; }
.tilt { transform-style: preserve-3d; transform: rotateX(-18deg); }
.spin { transform-style: preserve-3d; }
.e { position: absolute; left: 0; top: 0; height: 2px; margin-top: -1px; background: var(--ink); transform-origin: 0 50%; }
.e.ax { height: 1px; background: repeating-linear-gradient(90deg, var(--accent-2) 0 6px, transparent 6px 10px); }
.lab { position: absolute; left: 0; top: 0; font: 600 var(--t-1)/1 var(--mono); white-space: nowrap; transform-style: preserve-3d; }
.lab.ax { color: var(--accent-2); }
.lab.mi { color: var(--accent-1); }
.figno { position: absolute; left: calc(var(--u) * 3); top: calc(var(--u) * 3); font: 400 var(--t-1)/1.4 var(--mono); z-index: 2; }
.figno b { display: block; font: 600 var(--t2)/1.1 var(--serif); }
.data { padding: calc(var(--u) * 4) calc(var(--u) * 5); }
.data h2 { margin: 0; font: 600 var(--t3)/1.1 var(--serif); }
.data .form { font: 400 var(--t1)/1.3 var(--mono); color: var(--accent-1); margin: 4px 0 calc(var(--u) * 2); }
.data p { margin: 0 0 calc(var(--u) * 2); max-width: 48ch; }
table { width: 100%; border-collapse: collapse; font: 400 15px/1.4 var(--mono); font-variant-numeric: tabular-nums; margin-bottom: calc(var(--u) * 3); }
caption { text-align: left; font: 600 var(--t-1)/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; padding-bottom: var(--u); }
th, td { text-align: left; padding: 5px 8px 5px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 400; color: #5b6475; width: 38%; }
.figs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-top: 1px solid var(--ink); }
.figs button { all: unset; cursor: pointer; border-right: 1px solid var(--rule); padding: calc(var(--u) * 1.5); text-align: center; font: 400 12.5px/1.3 var(--mono); }
.figs button:last-child { border-right: 0; }
.figs button svg { width: 100%; height: 110px; display: block; }
.figs button[aria-pressed="true"] { background: #e8e3f6; }
.figs button:focus-visible { outline: 2px solid var(--accent-1); outline-offset: -2px; }
@media (prefers-reduced-motion: no-preference) {
  .spin { animation: spin 24s linear infinite; }
  @keyframes spin { to { transform: rotateY(360deg); } }
}
@media (prefers-reduced-motion: reduce) { .spin { transform: rotateY(32deg); } }
@media (max-width: 900px) {
  :root { --S: 70px; }
  .spec { grid-template-columns: minmax(0, 1fr); }
  .plate { min-height: 58vh; border-right: 0; border-bottom: 1px solid var(--ink); }
  .data { padding: calc(var(--u) * 3) calc(var(--u) * 2.5); }
  .figs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  header { padding: calc(var(--u) * 3) calc(var(--u) * 2.5) calc(var(--u) * 2); }
}
</style>
</head>
<body>
<header>
  <h1><small>Hallström Collection · Department of Mineralogy</small>Crystal Habit Register</h1>
  <nav class="pick" aria-label="Specimens" id="pick"></nav>
</header>
<main class="spec">
  <figure class="plate" style="margin:0" aria-label="Rotating wireframe of the crystal on its axis cross">
    <div class="figno" id="figno"></div>
    <div class="stage"><div class="tilt"><div class="spin" id="spin"></div></div></div>
  </figure>
  <section class="data" aria-live="polite">
    <h2 id="nm">Fluorite</h2>
    <div class="form" id="fm">CaF₂</div>
    <p id="tx"></p>
    <table><caption>Lattice</caption><tbody id="lat"></tbody></table>
    <table><caption>Specimen record</caption><tbody id="rec"></tbody></table>
  </section>
</main>
<nav class="figs" id="figs" aria-label="Figures on this plate"></nav>
<script>
(() => {
  const cube = () => { const v = []; for (const x of [-1, 1]) for (const y of [-1, 1]) for (const z of [-1, 1]) v.push([x, y, z]); const e = []; v.forEach((a, i) => v.forEach((b, j) => { if (j > i && a.filter((c, k) => c !== b[k]).length === 1) e.push([i, j]); })); return { v, e }; };
  const hex = (r, h, apex) => { const v = []; for (const y of [-h, h]) for (let k = 0; k < 6; k++) { const t = k * Math.PI / 3; v.push([r * Math.cos(t), y, r * Math.sin(t)]); } const e = []; for (let k = 0; k < 6; k++) { e.push([k, (k + 1) % 6], [6 + k, 6 + (k + 1) % 6], [k, 6 + k]); } if (apex) { v.push([0, -apex, 0], [0, apex, 0]); for (let k = 0; k < 6; k++) e.push([12, k], [13, 6 + k]); } return { v, e }; };
  const octa = () => { const s = 1.4, v = [[s, 0, 0], [-s, 0, 0], [0, s, 0], [0, -s, 0], [0, 0, s], [0, 0, -s]], e = []; for (let i = 0; i < 6; i++) for (let j = i + 1; j < 6; j++) if (Math.floor(i / 2) !== Math.floor(j / 2)) e.push([i, j]); return { v, e }; };
  const rhomb = () => { const c = cube(), k = .7, u = 1 / Math.sqrt(3); c.v = c.v.map(([x, y, z]) => { const d = (x + y + z) * u; return [x + k * d * u, y + k * d * u, z + k * d * u].map((t) => t * .8); }); return c; };
  const dodec = () => { const v = [], e = []; for (const x of [-1, 1]) for (const y of [-1, 1]) for (const z of [-1, 1]) v.push([x * .8, y * .8, z * .8]); const ax = [[1.6, 0, 0], [-1.6, 0, 0], [0, 1.6, 0], [0, -1.6, 0], [0, 0, 1.6], [0, 0, -1.6]]; ax.forEach((a) => v.push(a));
    for (let i = 0; i < 8; i++) for (let j = 8; j < 14; j++) { const a = v[i], b = v[j], k = b.findIndex((t) => t !== 0); if (Math.sign(a[k]) === Math.sign(b[k])) e.push([i, j]); } return { v, e }; };
  const M = [
    { n: "Fluorite", f: "CaF₂", g: octa(), sys: "Cubic", sg: "Fm3̄m", a: "5.463 Å", b: "5.463 Å", c: "5.463 Å", ang: "90° 90° 90°", H: "4", D: "3.18 g/cm³", mi: [["(111)", [.55, .55, .55]], ["(1̄11)", [-.55, .55, .55]]],
      t: "Octahedral habit from the Weardale mines, violet with a blue fluorescent rim. Cleaves perfectly along the octahedron faces; the collection keeps a cleaved pair beside the whole crystal.", r: ["HM-1144", "Heights Mine, Weardale, England", "4.2 × 3.8 cm", "Bequest of E. Hallström, 1962"] },
    { n: "Pyrite", f: "FeS₂", g: cube(), sys: "Cubic", sg: "Pa3̄", a: "5.417 Å", b: "5.417 Å", c: "5.417 Å", ang: "90° 90° 90°", H: "6–6.5", D: "5.01 g/cm³", mi: [["(100)", [1.25, 0, 0]], ["(010)", [0, 1.25, 0]], ["(001)", [0, 0, 1.25]]],
      t: "Striated cubes on marl, the striations on each face running at right angles to those on its neighbours. That is the mark of pyrite’s lower symmetry.", r: ["HM-0310", "Navajún, La Rioja, Spain", "2.9 cm cube", "Purchased 1971"] },
    { n: "Quartz", f: "SiO₂", g: hex(.72, 1, 1.75), sys: "Trigonal", sg: "P3₂21", a: "4.913 Å", b: "4.913 Å", c: "5.405 Å", ang: "90° 90° 120°", H: "7", D: "2.65 g/cm³", mi: [["(101̄0)", [.95, 0, 0]], ["(101̄1)", [.4, 1.35, 0]]],
      t: "A doubly terminated crystal, grown free in clay so that both ends formed. The prism faces show horizontal growth lines, as quartz prisms always do.", r: ["HM-2207", "Herkimer County, New York", "5.1 cm long", "Exchange with the Smithsonian, 1988"] },
    { n: "Calcite", f: "CaCO₃", g: rhomb(), sys: "Trigonal", sg: "R3̄c", a: "4.990 Å", b: "4.990 Å", c: "17.061 Å", ang: "90° 90° 120°", H: "3", D: "2.71 g/cm³", mi: [["(101̄4)", [.9, .9, 0]]],
      t: "A cleavage rhomb of Iceland spar. Lay it on a printed line and the line doubles; the collection’s rhomb has sat on the same index card since 1964.", r: ["HM-0022", "Helgustaðir, Iceland", "6.0 cm", "Hallström founding gift"] },
    { n: "Garnet", f: "Fe₃Al₂(SiO₄)₃", g: dodec(), sys: "Cubic", sg: "Ia3̄d", a: "11.526 Å", b: "11.526 Å", c: "11.526 Å", ang: "90° 90° 90°", H: "7–7.5", D: "4.31 g/cm³", mi: [["(110)", [.8, .8, 0]], ["(011)", [0, .8, .8]]],
      t: "Almandine in the rhombic dodecahedron, twelve faces, each a rhombus. Found loose in schist on a walk above Røros in 1958.", r: ["HM-0871", "Røros, Norway", "1.8 cm", "Collected by E. Hallström"] },
    { n: "Beryl", f: "Be₃Al₂Si₆O₁₈", g: hex(.8, 1.4, 0), sys: "Hexagonal", sg: "P6/mcc", a: "9.21 Å", b: "9.21 Å", c: "9.19 Å", ang: "90° 90° 120°", H: "7.5–8", D: "2.76 g/cm³", mi: [["(0001)", [0, 1.55, 0]], ["(101̄0)", [1, 0, 0]]],
      t: "A pale aquamarine prism with a flat basal pinacoid, the simplest beryl habit. Hexagonal to the eye; the lattice agrees.", r: ["HM-1590", "Erongo Mountains, Namibia", "7.4 cm", "Purchased 1999"] }
  ];
  const $ = (id) => document.getElementById(id), spin = $("spin");
  const S = () => parseFloat(getComputedStyle(spin).getPropertyValue("--S")) || parseFloat(getComputedStyle(document.documentElement).fontSize) * 6;
  const edge = (p, q, cls, s) => { const [x1, y1, z1] = [p[0] * s, -p[1] * s, p[2] * s], dx = (q[0] - p[0]) * s, dy = -(q[1] - p[1]) * s, dz = (q[2] - p[2]) * s, L = Math.hypot(dx, dy, dz), phi = Math.asin(dy / L), th = Math.atan2(-dz, dx);
    return `<div class="e ${cls}" style="width:${L.toFixed(1)}px;transform:translate3d(${x1.toFixed(1)}px,${y1.toFixed(1)}px,${z1.toFixed(1)}px) rotateY(${th.toFixed(4)}rad) rotateZ(${phi.toFixed(4)}rad)"></div>`; };
  const lab = (p, t, cls, s) => `<span class="lab ${cls}" style="transform:translate3d(${(p[0] * s).toFixed(1)}px,${(-p[1] * s).toFixed(1)}px,${(p[2] * s).toFixed(1)}px)">${t}</span>`;
  const unit = () => { const w = Math.min(innerWidth, 1600); return innerWidth <= 900 ? 70 : Math.min(150, w * .095); };
  function show(i) {
    const m = M[i], s = unit(); let h = "";
    [[[-2.2, 0, 0], [2.2, 0, 0], "a"], [[0, 0, -2.2], [0, 0, 2.2], "b"], [[0, -2.3, 0], [0, 2.3, 0], "c"]].forEach(([p, q, l]) => { h += edge(p, q, "ax", s) + lab(q, l, "ax", s); });
    m.g.e.forEach(([a, b]) => (h += edge(m.g.v[a], m.g.v[b], "", s)));
    m.mi.forEach(([t, p]) => (h += lab(p, t, "mi", s)));
    spin.innerHTML = h;
    $("figno").innerHTML = `<b>Fig. ${i + 1}</b>${m.n} · habit after the specimen`;
    $("nm").textContent = m.n; $("fm").textContent = m.f; $("tx").textContent = m.t;
    $("lat").innerHTML = [["Crystal system", m.sys], ["Space group", m.sg], ["a, b, c", `${m.a}, ${m.b}, ${m.c}`], ["α, β, γ", m.ang], ["Mohs hardness", m.H], ["Density", m.D]].map(([a, b]) => `<tr><th>${a}</th><td>${b}</td></tr>`).join("");
    $("rec").innerHTML = [["Accession", m.r[0]], ["Locality", m.r[1]], ["Size", m.r[2]], ["Acquired", m.r[3]]].map(([a, b]) => `<tr><th>${a}</th><td>${b}</td></tr>`).join("");
    document.querySelectorAll("#pick button, #figs button").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.i === i)));
  }
  // the six figures of the plate, drawn in fixed clinographic projection
  const proj = ([x, y, z]) => { const a = -.35, b = .32; const X = x * Math.cos(a) + z * Math.sin(a), Z = -x * Math.sin(a) + z * Math.cos(a); const Y = y * Math.cos(b) - Z * Math.sin(b); return [50 + X * 20, 55 - Y * 20]; };
  $("figs").innerHTML = M.map((m, i) => `<button type="button" data-i="${i}" aria-pressed="false"><svg viewBox="0 0 100 110" aria-hidden="true">${m.g.e.map(([a, b]) => { const p = proj(m.g.v[a]), q = proj(m.g.v[b]); return `<line x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${q[0].toFixed(1)}" y2="${q[1].toFixed(1)}" stroke="#1d2433" stroke-width="1"/>`; }).join("")}</svg>Fig. ${i + 1} · ${m.n}</button>`).join("");
  $("pick").innerHTML = M.map((m, i) => `<button type="button" data-i="${i}" aria-pressed="false">${m.n}</button>`).join("");
  document.querySelectorAll("#pick, #figs").forEach((n) => n.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) show(+b.dataset.i); }));
  show(0);
  let w = innerWidth; addEventListener("resize", () => { if (Math.abs(innerWidth - w) > 60) { w = innerWidth; show(M.findIndex((m, i) => document.querySelector(`#pick button[data-i="${i}"]`).getAttribute("aria-pressed") === "true")); } });
})();
</script>
</body>
</html>

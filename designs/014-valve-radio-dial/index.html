<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valve Radio Dial · Centiform</title>
<style>
/* @fonts: Limelight:400:block; Marcellus:400:swap */
@font-face{font-family:"Limelight";font-style:normal;font-weight:400;font-display:block;src:url(fonts/limelight-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:"Marcellus";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/marcellus-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
/* @fonts-end */
:root {
  --bg: #3e2417;          /* walnut bakelite */
  --ink: #e8d49a;         /* dial glass lit from behind */
  --accent-1: #b23a1c;    /* needle, on-air */
  --accent-2: #c9a14a;    /* brass trim */
  --bak-hi: #6a3d24;
  --bak-lo: #24140c;
  --glass-ink: #3a2412;
  --eye: #58e07a;
  --u: 8px;
  /* scale 1.25 on 18px */
  --t-1: 13px; --t0: 18px; --t1: 22.5px; --t2: 28px; --t3: 35px; --t4: clamp(40px, 5vw, 76px);
  --deco: "Limelight", Georgia, serif;
  --text: "Marcellus", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #1a0f09; color: var(--ink); }
body { font: 400 var(--t0)/1.6 var(--text); min-height: 100vh; padding: calc(var(--u) * 3); display: grid; place-items: start center; }
.set { width: min(100%, 1500px); border-radius: 48px 48px 20px 20px; padding: calc(var(--u) * 4) calc(var(--u) * 5) calc(var(--u) * 5);
  background: radial-gradient(140% 90% at 30% 0%, var(--bak-hi), var(--bg) 45%, var(--bak-lo)); box-shadow: inset 0 3px 0 rgba(255,220,180,.18), inset 0 -8px 20px rgba(0,0,0,.5), 0 30px 60px -20px #000; }
.top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: calc(var(--u) * 4); align-items: center; }
.grille { height: clamp(120px, 20vh, 220px); border-radius: 24px 24px 8px 8px; position: relative; overflow: hidden; box-shadow: inset 0 0 0 6px var(--accent-2), inset 0 0 0 8px #6b4f1e, inset 0 6px 16px rgba(0,0,0,.6);
  background: repeating-linear-gradient(45deg, #8a6b45 0 2px, #6f5235 2px 4px), #7a5c3c; }
.grille::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 34px, rgba(62,36,23,.9) 34px 44px); }
.grille h1 { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; font: 400 var(--t4)/1 var(--deco); color: var(--accent-2); text-shadow: 0 2px 0 #3a2410, 0 0 1px #000; letter-spacing: .04em; z-index: 1; text-align: center; }
.badge { text-align: center; font: 400 var(--t-1)/1.4 var(--text); letter-spacing: .2em; text-transform: uppercase; color: var(--accent-2); }
.eye { width: 64px; height: 64px; margin: 0 auto 8px; border-radius: 50%; background: radial-gradient(circle, #0b1a0f 0 18%, transparent 19%), conic-gradient(from calc(90deg + var(--open, 30deg)) , #0f2a17 0 calc(180deg - var(--open, 30deg) * 2), var(--eye) 0 180deg, #0f2a17 0 calc(360deg - var(--open, 30deg) * 2), var(--eye) 0); box-shadow: 0 0 0 4px var(--accent-2), 0 0 18px rgba(88,224,122,.5); transition: --open .5s; }
/* the dial */
.dial { position: relative; margin-top: calc(var(--u) * 4); border-radius: 12px; padding: calc(var(--u) * 2) calc(var(--u) * 3); box-shadow: inset 0 0 0 5px var(--accent-2), inset 0 0 0 7px #6b4f1e;
  background: radial-gradient(80% 140% at 50% 60%, #fff4c8, var(--ink) 55%, #b49a58); color: var(--glass-ink); overflow: hidden; }
@media (prefers-reduced-motion: no-preference) {
  .dial { animation: warm 2.4s ease-out both; }
  @keyframes warm { 0% { filter: brightness(.25) saturate(.4); } 60% { filter: brightness(.8); } 100% { filter: none; } }
  .needle { transition: left .9s cubic-bezier(.4,0,.2,1); }
}
.bands { display: grid; gap: 4px; position: relative; }
.band { display: grid; grid-template-columns: 80px minmax(0, 1fr); align-items: center; gap: var(--u); }
.band b { font: 400 11px/1 var(--text); letter-spacing: .2em; color: #6b4a22; }
.scale { position: relative; height: 26px; border-bottom: 1px solid rgba(58,36,18,.5); }
.scale i { position: absolute; bottom: 0; width: 1px; height: 8px; background: var(--glass-ink); }
.scale i.l { height: 14px; }
.scale span { position: absolute; bottom: 12px; transform: translateX(-50%); font: 400 11px/1 var(--text); white-space: nowrap; }
.cities { position: relative; height: 64px; margin-left: 88px; }
.cities button { all: unset; cursor: pointer; position: absolute; top: 8px; transform: translateX(-50%) rotate(-24deg); transform-origin: 50% 50%; font: 400 var(--t0)/1 var(--deco); color: var(--glass-ink); white-space: nowrap; padding: 4px; }
.cities button[aria-pressed="true"] { color: var(--accent-1); }
.cities button:focus-visible { outline: 2px solid var(--accent-1); }
.needle { position: absolute; top: 6px; bottom: 6px; left: 50%; width: 3px; background: var(--accent-1); box-shadow: 0 0 6px rgba(178,58,28,.6); pointer-events: none; }
.needle::before { content: ""; position: absolute; top: -2px; left: -5px; border: 6.5px solid transparent; border-top-color: var(--accent-1); }
.controls { display: flex; justify-content: space-between; align-items: center; margin-top: calc(var(--u) * 3); gap: calc(var(--u) * 2); }
.knob { width: 84px; height: 84px; border-radius: 50%; border: 0; cursor: pointer; background: radial-gradient(circle at 40% 35%, #7a4a2c, #2a160c 70%); box-shadow: 0 0 0 5px var(--accent-2), 0 0 0 7px #3a2410, 0 8px 12px rgba(0,0,0,.6); position: relative; color: var(--accent-2); font: 400 var(--t-1)/1 var(--text); letter-spacing: .1em; }
.knob::after { content: ""; position: absolute; left: 50%; top: 8px; width: 4px; height: 20px; margin-left: -2px; background: var(--accent-2); border-radius: 2px; transform-origin: 2px 34px; transform: rotate(var(--rot, 0deg)); }
.knob:focus-visible { outline: 3px solid var(--ink); outline-offset: 6px; }
.controls p { margin: 0; text-align: center; font: 400 var(--t-1)/1.4 var(--text); letter-spacing: .18em; text-transform: uppercase; color: var(--accent-2); }
/* the programme card for the tuned station */
.card { margin-top: calc(var(--u) * 4); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: calc(var(--u) * 5); border-top: 2px solid var(--accent-2); padding-top: calc(var(--u) * 3); }
.card h2 { margin: 0; font: 400 var(--t3)/1.1 var(--deco); color: var(--ink); }
.card .freq { font: 400 var(--t-1)/1 var(--text); letter-spacing: .2em; color: var(--accent-2); text-transform: uppercase; }
.card p { margin: var(--u) 0 0; color: #e0cfa2; max-width: 48ch; }
.eps { list-style: none; margin: 0; padding: 0; }
.eps li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: calc(var(--u) * 2); align-items: center; padding: calc(var(--u) * 1.5) 0; border-bottom: 1px solid rgba(201,161,74,.35); }
.eps .t { font: 400 var(--t1)/1.2 var(--text); color: var(--ink); }
.eps .m { display: block; font-size: 15px; color: #c8b584; }
.eps .d { font: 400 15px/1 var(--text); color: var(--accent-2); font-variant-numeric: tabular-nums; }
.eps button { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--accent-2); background: transparent; color: var(--ink); cursor: pointer; display: grid; place-items: center; }
.eps button svg { width: 14px; height: 14px; }
.eps button[aria-pressed="true"] { background: var(--accent-1); border-color: var(--accent-1); }
.eps button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
@media (max-width: 860px) {
  body { padding: var(--u); }
  .set { padding: calc(var(--u) * 2); border-radius: 28px 28px 12px 12px; }
  .top { grid-template-columns: minmax(0, 1fr); }
  .badge { display: none; }
  .band b { display: none; }
  .band { grid-template-columns: minmax(0, 1fr); }
  .cities { margin-left: 0; height: 80px; }
  .cities button { font-size: 13px; transform: translateX(-50%) rotate(-60deg); top: 22px; }
  .card { grid-template-columns: minmax(0, 1fr); }
  .knob { width: 60px; height: 60px; }
  .knob::after { transform-origin: 2px 22px; height: 14px; }
  .dial { padding: var(--u); }
}
</style>
</head>
<body>
<main class="set">
  <div class="top">
    <div class="grille"><h1>The Wireless Stage</h1></div>
    <div class="badge"><div class="eye" id="eye" aria-hidden="true"></div>Tuning<br>eye</div>
  </div>
  <section class="dial" aria-label="Tuning dial">
    <div class="bands">
      <div class="band"><b>LONG</b><div class="scale" id="lw"></div></div>
      <div class="band"><b>MEDIUM</b><div class="scale" id="mw"></div></div>
    </div>
    <div class="cities" id="cities" role="group" aria-label="Stations"></div>
    <span class="needle" id="needle" aria-hidden="true"></span>
  </section>
  <div class="controls">
    <button class="knob" type="button" id="down" aria-label="Tune down">&lt;</button>
    <p>1,204 radio plays · 1938–1962<br>Tune the dial to a station</p>
    <button class="knob" type="button" id="up" aria-label="Tune up">&gt;</button>
  </div>
  <section class="card" aria-live="polite">
    <div><span class="freq" id="fq"></span><h2 id="st"></h2><p id="ds"></p></div>
    <ol class="eps" id="eps"></ol>
  </section>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  // station city, genre, kc/s, position %, description, episodes [title, writer, broadcast, length]
  const S = [
    ["Droitwich", "Mysteries", "200", 8, "Locked rooms, fog on the platform, and one detective who always takes the last train home. 312 plays.", [["The Lamp at Ferrybridge", "Nora Haldane", "4 Nov 1947", "28 min"], ["Six Minutes Past Midnight", "C. P. Lowther", "12 Mar 1949", "44 min"], ["The Quiet Signalbox", "Nora Haldane", "2 Dec 1951", "30 min"]]],
    ["Hilversum", "Adventure", "301", 26, "Rope bridges, lost maps and the North Atlantic in winter, performed with a thunder sheet and two coconut shells.", [["Captain Orme of the Albatross", "Rex Talbot", "7 Jun 1938", "30 min"], ["The Kilimanjaro Letters", "Hugh Mbeki", "18 Oct 1950", "58 min"], ["Ice at Lerwick", "Rex Talbot", "9 Jan 1955", "30 min"]]],
    ["Athlone", "Comedy", "531", 43, "Boarding houses, bandstands and a family who cannot agree on the wireless. Recorded before a studio audience.", [["Mrs Pym Buys a Car", "Dolly Farrant", "3 Apr 1952", "29 min"], ["The Pier at Low Tide", "Ben Ashworth", "21 Aug 1953", "29 min"], ["All Change at Crewe", "Dolly Farrant", "5 May 1956", "30 min"]]],
    ["Lyons", "Serials", "602", 58, "Stories told in fifteen-minute pieces at a quarter to seven, so that the whole country would sit down together.", [["The Harrowgate Inheritance, part 1", "Mary Coyle", "1 Sep 1946", "15 min"], ["The Harrowgate Inheritance, part 2", "Mary Coyle", "2 Sep 1946", "15 min"], ["Children of the Mill, part 14", "J. D. Ingram", "11 Feb 1958", "15 min"]]],
    ["Rennes", "Tomorrow", "782", 74, "Science fiction from the atomic years: moon rockets, thinking machines and a very polite Martian.", [["The Signal from Ceres", "Owen Treharne", "27 Jul 1954", "45 min"], ["Machine in the Cellar", "L. K. Adeyemi", "30 Mar 1957", "30 min"], ["Return to Earth, Please", "Owen Treharne", "15 Nov 1959", "60 min"]]],
    ["Brussels", "Children’s Hour", "926", 90, "Five o’clock every weekday: fairy stories, nature talks and the adventures of a railway engine called Tobias.", [["Tobias and the Snowplough", "Aunt Gwen", "19 Dec 1948", "20 min"], ["The Owl Who Would Not Sleep", "Peter Crane", "3 Mar 1950", "15 min"], ["Under the Pier", "Aunt Gwen", "22 Jul 1953", "20 min"]]]
  ];
  let cur = 2;
  const scale = (el, lo, hi, step) => { let h = ""; for (let v = lo; v <= hi; v += step) { const x = (v - lo) / (hi - lo) * 100, big = (v / step) % 5 === 0; h += `<i class="${big ? "l" : ""}" style="left:${x}%"></i>` + (big ? `<span style="left:${x}%">${v}</span>` : ""); } el.innerHTML = h; };
  scale($("lw"), 150, 350, 10); scale($("mw"), 500, 1600, 20);
  $("cities").innerHTML = S.map(([c, g, k, p], i) => `<button type="button" data-i="${i}" style="left:${p}%" aria-pressed="false" aria-label="${c}, ${g}">${c}</button>`).join("");
  function tune(i) {
    cur = (i + S.length) % S.length;
    const [c, g, k, p, d, eps] = S[cur];
    const cities = $("cities"), dial = cities.parentElement;
    const cr = cities.getBoundingClientRect(), dr = dial.getBoundingClientRect();
    $("needle").style.left = (cr.left - dr.left + cr.width * p / 100) + "px";
    cities.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.i === cur)));
    $("fq").textContent = `${c} · ${k} kc/s`; $("st").textContent = g; $("ds").textContent = d;
    $("eps").innerHTML = eps.map(([t, w, b, l], j) => `<li><button type="button" aria-pressed="false" aria-label="Play ${t}"><svg viewBox="0 0 14 14"><path d="M3 1 L13 7 L3 13Z" fill="currentColor"/></svg></button><span class="t">${t}<span class="m">by ${w} · first heard ${b}</span></span><span class="d">${l}</span></li>`).join("");
    $("down").style.setProperty("--rot", (cur * 50 - 120) + "deg"); $("up").style.setProperty("--rot", (cur * 50 - 120) + "deg");
    $("eye").style.setProperty("--open", "30deg");
  }
  $("cities").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) tune(+b.dataset.i); });
  $("down").addEventListener("click", () => tune(cur - 1));
  $("up").addEventListener("click", () => tune(cur + 1));
  $("eps").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; const on = b.getAttribute("aria-pressed") !== "true"; $("eps").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", String(on)); $("eye").style.setProperty("--open", on ? "4deg" : "30deg"); });
  addEventListener("resize", () => tune(cur));
  tune(cur);
})();
</script>
</body>
</html>
